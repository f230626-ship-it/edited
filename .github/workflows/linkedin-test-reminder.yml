name: LinkedIn Reminder → Sales Channel (Test)

on:
  # Test schedule — August 14, 2026
  # First reminder:  4:30 PM PKT = 11:30 UTC
  # Follow-up:       5:30 PM PKT = 12:30 UTC (exactly 1 hour after first reminder)
  schedule:
    - cron: "30 11 14 8 *"
    - cron: "30 12 14 8 *"
  # Allow manual trigger anytime for testing
  workflow_dispatch:
    inputs:
      endpoint:
        description: "Which endpoint to trigger"
        required: true
        default: "reminder"
        type: choice
        options:
          - reminder
          - followup

jobs:
  reminder:
    name: Send LinkedIn Reminder to Sales Channel (July 2026 Test)
    runs-on: ubuntu-latest
    if: >
      (github.event_name == 'workflow_dispatch' && github.event.inputs.endpoint == 'reminder') ||
      (github.event_name == 'schedule' && github.event.schedule == '30 11 14 8 *')
    steps:
      - name: Trigger LinkedIn test reminder
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          echo "Triggering LinkedIn reminder → Sales channel (July 2026 test)..."
          response=$(curl -sS -w "\nHTTP_STATUS:%{http_code}" -X GET \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Accept: application/json" \
            https://edited-one.vercel.app/api/cron/linkedin-test-reminder)
          echo "$response"
          status=$(echo "$response" | grep "HTTP_STATUS" | cut -d: -f2)
          if [ "$status" != "200" ]; then
            echo "ERROR: Got HTTP $status"
            exit 1
          fi

  followup:
    name: Send LinkedIn Follow-up to Sales Channel (July 2026 Test — 1 hour later)
    runs-on: ubuntu-latest
    if: >
      (github.event_name == 'workflow_dispatch' && github.event.inputs.endpoint == 'followup') ||
      (github.event_name == 'schedule' && github.event.schedule == '30 12 14 8 *')
    steps:
      - name: Trigger LinkedIn test follow-up
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          echo "Triggering LinkedIn follow-up → Sales channel (July 2026 test, fresh DB check)..."
          response=$(curl -sS -w "\nHTTP_STATUS:%{http_code}" -X GET \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Accept: application/json" \
            https://edited-one.vercel.app/api/cron/linkedin-test-followup)
          echo "$response"
          status=$(echo "$response" | grep "HTTP_STATUS" | cut -d: -f2)
          if [ "$status" != "200" ]; then
            echo "ERROR: Got HTTP $status"
            exit 1
          fi
