name: LinkedIn Reminder → AI Testing Channel

on:
  # Wednesday 3:00 PM PKT = 10:00 UTC — same as production reminder
  schedule:
    - cron: "0 10 * * 3"
    - cron: "0 10 * * 4"
  # Allow manual trigger anytime for testing
  workflow_dispatch:
    inputs:
      endpoint:
        description: "Which endpoint to trigger"
        required: true
        default: "reminder"
        type: choice
        options:
          - reminder
          - followup

jobs:
  reminder:
    name: Send LinkedIn Reminder to AI Testing Channel
    runs-on: ubuntu-latest
    if: >
      (github.event_name == 'workflow_dispatch' && github.event.inputs.endpoint == 'reminder') ||
      (github.event_name == 'schedule' && github.event.schedule == '0 10 * * 3')
    steps:
      - name: Trigger LinkedIn test reminder
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          echo "Triggering LinkedIn reminder → AI Testing channel..."
          response=$(curl -sS -w "\nHTTP_STATUS:%{http_code}" -X GET \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Accept: application/json" \
            https://edited-one.vercel.app/api/cron/linkedin-test-reminder)
          echo "$response"
          status=$(echo "$response" | grep "HTTP_STATUS" | cut -d: -f2)
          if [ "$status" != "200" ]; then
            echo "ERROR: Got HTTP $status"
            exit 1
          fi

  followup:
    name: Send LinkedIn Follow-up to AI Testing Channel
    runs-on: ubuntu-latest
    if: >
      (github.event_name == 'workflow_dispatch' && github.event.inputs.endpoint == 'followup') ||
      (github.event_name == 'schedule' && github.event.schedule == '0 10 * * 4')
    steps:
      - name: Trigger LinkedIn test follow-up
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          echo "Triggering LinkedIn follow-up → AI Testing channel..."
          response=$(curl -sS -w "\nHTTP_STATUS:%{http_code}" -X GET \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Accept: application/json" \
            https://edited-one.vercel.app/api/cron/linkedin-test-followup)
          echo "$response"
          status=$(echo "$response" | grep "HTTP_STATUS" | cut -d: -f2)
          if [ "$status" != "200" ]; then
            echo "ERROR: Got HTTP $status"
            exit 1
          fi
